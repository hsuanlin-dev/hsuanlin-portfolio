<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 24px; font-weight: bold; fill: #1a1a1a; letter-spacing: 1px; }
      .box-title { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 16px; font-weight: bold; }
      .box-desc { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; fill: #555555; line-height: 1.5; }
      .label-text { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: bold; fill: #333333; }
      .code-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; font-weight: bold; }
      .badge-text { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .flow-text { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: bold; }
      
      /* 陰影效果 */
      .shadow { filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.08)); }
      .shadow-sm { filter: drop-shadow(0px 2px 5px rgba(0, 0, 0, 0.05)); }
    </style>
    
    <marker id="arrow-macro" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3182ce"/>
    </marker>
    <marker id="arrow-micro" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e53e3e"/>
    </marker>
  </defs>

  <rect width="1020" height="700" rx="16" fill="#f7fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="50" y="45" class="title">JavaScript Runtime ── 限流策略的底層分流與調度機制</text>

  <g class="shadow">
    <rect x="70" y="90" width="380" height="220" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="2"/>
    <text x="90" y="125" class="box-title" fill="#9b2c2c">呼叫堆疊 (Call Stack)</text>
    <text x="90" y="148" class="box-desc">JS 主執行緒，一次一行，同步執行應用層的限流策略</text>
  </g>
  
  <g class="shadow-sm">
    <rect x="90" y="180" width="90" height="45" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="135" y="207" text-anchor="middle" class="label-text">防抖策略</text>
  </g>
  <g class="shadow-sm">
    <rect x="200" y="180" width="90" height="45" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="245" y="207" text-anchor="middle" class="label-text">節流策略</text>
  </g>
  <g class="shadow-sm">
    <rect x="315" y="180" width="115" height="110" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="372" y="210" text-anchor="middle" class="label-text" fill="#e53e3e">併發控制</text>
    <text x="372" y="235" text-anchor="middle" class="code-text" fill="#9b2c2c">runWithLimit</text>
    <text x="372" y="265" text-anchor="middle" class="box-desc" fill="#e53e3e" style="font-size:11px; font-weight: bold;">(定義補位規則)</text>
  </g>
  
  <rect x="90" y="250" width="200" height="40" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
  <text x="105" y="274" class="code-text" fill="#4a5568">主執行緒同步程式碼 (執行)</text>


  <g class="shadow">
    <rect x="540" y="90" width="410" height="220" rx="12" fill="#f0fff4" stroke="#9ae6b4" stroke-width="2"/>
    <text x="560" y="125" class="box-title" fill="#22543d">瀏覽器環境 (Web APIs)</text>
    <text x="560" y="148" class="box-desc">多執行緒環境，負責實際計時與發送網路請求</text>
  </g>

  <g class="shadow-sm">
    <rect x="560" y="180" width="220" height="50" rx="6" fill="#ffffff" stroke="#3182ce" stroke-width="1.5"/>
    <text x="575" y="210" text-anchor="start" class="code-text" fill="#2b6cb0">setTimeout()</text>
    <text x="675" y="210" text-anchor="start" class="box-desc" style="font-size:11px; font-weight: 500;">── 防抖/節流計時</text>
  </g>
  <g class="shadow-sm">
    <rect x="560" y="250" width="220" height="50" rx="6" fill="#ffffff" stroke="#e53e3e" stroke-width="2"/>
    <text x="575" y="280" text-anchor="start" class="code-text" fill="#b7791f">fetch()</text>
    <text x="635" y="280" text-anchor="start" class="box-desc" fill="#e53e3e" style="font-size:11px; font-weight:bold;">── 實際網路連線 (併發)</text>
  </g>
  <rect x="795" y="180" width="135" height="120" rx="6" fill="#edf2f7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="862" y="230" text-anchor="middle" class="box-desc" fill="#718096">DOM 事件 / XHR</text>
  <text x="862" y="255" text-anchor="middle" class="box-desc" fill="#718096">Storage 儲存處理</text>


  <g class="shadow">
    <rect x="70" y="380" width="410" height="110" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="2"/>
    <rect x="85" y="392" width="60" height="22" rx="4" fill="#e53e3e"/>
    <text x="115" y="408" text-anchor="middle" class="badge-text">微任務</text>
    <text x="155" y="409" class="box-title" fill="#9b2c2c">微任務佇列 (Microtask Queue)</text>
    <text x="85" y="435" class="box-desc">存放 Promise 完成、await 釋放後的回呼。特權：優先清空此佇列</text>
  </g>
  <g class="shadow-sm">
    <rect x="85" y="450" width="165" height="32" rx="4" fill="#ffffff" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="95" y="470" class="code-text" fill="#b7791f">worker() 補位核心回呼</text>
  </g>
  <g class="shadow-sm">
    <rect x="260" y="450" width="110" height="32" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
    <text x="272" y="470" class="code-text" fill="#718096">Promise.then</text>
  </g>

  <g class="shadow">
    <rect x="540" y="380" width="410" height="110" rx="12" fill="#ebf8ff" stroke="#bee3f8" stroke-width="2"/>
    <rect x="555" y="392" width="60" height="22" rx="4" fill="#3182ce"/>
    <text x="585" y="408" text-anchor="middle" class="badge-text">宏任務</text>
    <text x="625" y="409" class="box-title" fill="#2b6cb0">宏任務佇列 (Macrotask Queue)</text>
    <text x="555" y="435" class="box-desc">存放定時器到期的回呼。規則：每一輪 Event Loop 僅執行一個</text>
  </g>
  <g class="shadow-sm">
    <rect x="555" y="450" width="180" height="32" rx="4" fill="#ffffff" stroke="#3182ce" stroke-width="1.5"/>
    <text x="565" y="470" class="code-text" fill="#1a365d">handleSearch / handleDrag</text>
  </g>
  <g class="shadow-sm">
    <rect x="745" y="450" width="110" height="32" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
    <text x="757" y="470" class="code-text" fill="#718096">timer 回呼</text>
  </g>


  <g class="shadow">
    <rect x="70" y="560" width="880" height="80" rx="12" fill="#f3e8ff" stroke="#d6bcfa" stroke-width="2"/>
    <text x="100" y="605" class="box-title" fill="#4c1d95" style="font-size: 18px;">事件循環引擎 (Event Loop)</text>
    <text x="330" y="603" class="box-desc" fill="#5b21b6" style="font-weight: bold;">當呼叫堆疊清空時，優先清空微任務佇列，再拉取宏任務至堆疊執行</text>
  </g>


  <path d="M 450,195 L 560,195" fill="none" stroke="#3182ce" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-macro)"/>
  <path d="M 430,245 L 500,245 L 500,275 L 560,275" fill="none" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow-micro)"/>
  <text x="505" y="180" text-anchor="middle" class="flow-text" fill="#2b6cb0">註冊計時器</text>
  <text x="505" y="235" text-anchor="middle" class="flow-text" fill="#e53e3e">await 發射 fetch</text>

  <path d="M 670,300 L 670,335 L 275,335 L 275,370" fill="none" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow-micro)"/>
  <text x="495" y="325" text-anchor="middle" class="flow-text" fill="#e53e3e">Network Resolve (請求完成)</text>
  
  <path d="M 780,205 L 900,205 L 900,335 L 760,335 L 760,370" fill="none" stroke="#3182ce" stroke-width="2" marker-end="url(#arrow-macro)"/>
  <text x="830" y="325" text-anchor="middle" class="flow-text" fill="#2b6cb0">Timer 倒數結束</text>

  <path d="M 275,490 L 275,552" fill="none" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow-micro)"/>
  <path d="M 760,490 L 760,552" fill="none" stroke="#3182ce" stroke-width="2" marker-end="url(#arrow-macro)"/>
  
  <rect x="145" y="510" width="115" height="24" rx="4" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="202" y="526" text-anchor="middle" class="flow-text" fill="#e53e3e">⭐ 絕對優先清空</text>
  
  <rect x="770" y="510" width="105" height="24" rx="4" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1"/>
  <text x="822" y="526" text-anchor="middle" class="flow-text" fill="#3182ce">一輪僅執行一個</text>

  <path d="M 70,600 L 25,600 L 25,120 L 62,120" fill="none" stroke="#e53e3e" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-micro)"/>
  
  <g class="shadow">
    <rect x="35" y="315" width="185" height="48" rx="6" fill="#e53e3e"/>
    <text x="127" y="334" text-anchor="middle" class="badge-text" style="font-size:12px; fill:#ffffff; font-weight:bold;">幕後核心：併發調度閉環</text>
    <text x="127" y="352" text-anchor="middle" class="badge-text" style="font-size:10px; fill:#fffff0;">(Event Loop 強制推進下一筆補位)</text>
  </g>

</svg>
