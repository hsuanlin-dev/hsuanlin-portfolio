<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
<title id="title">Debounce vs Throttle</title><desc id="desc">Debounce fires after 300ms of inactivity; Throttle runs at most once per 1000ms while events continue.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#253349}.h1{font-size:33px;font-weight:700}.sub{font-size:17px;fill:#64748b}.h2{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:13px}.bold{font-weight:700}.blue{fill:#2563eb}.muted{fill:#64748b}.white{fill:white}.line{stroke:#94a3b8;stroke-width:2}.guide{stroke:#cbd5e1;stroke-dasharray:4 5}.result{font-size:17px;font-weight:600}
</style><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="900" fill="#fff"/>
<text x="600" y="60" text-anchor="middle" class="h1" font-family="Arial, Helvetica, sans-serif">Debounce vs Throttle</text><text x="600" y="92" text-anchor="middle" class="sub" font-family="Arial, Helvetica, sans-serif">Choose by interaction needs, not by event name</text>
<!-- Debounce -->
<rect x="45" y="125" width="1110" height="305" rx="14" fill="#f8fbff" stroke="#b7d5fd" stroke-width="2"/>
<text x="75" y="170" class="h2" font-family="Arial, Helvetica, sans-serif">1. Debounce — Wait until events stop</text>
<text x="75" y="206" class="small muted" font-family="Arial, Helvetica, sans-serif">Search input: reset the timer on every event; execute after 300ms of inactivity</text>
<line x1="115" y1="283" x2="1085" y2="283" class="line" marker-end="url(#arr)"/>
<!-- 0 100 200 at 165 350 535 and 500 at 1090? use x 980 for 500 -->
<g class="body" text-anchor="middle">
<text x="155" y="243" font-family="Arial, Helvetica, sans-serif">Type A</text><text x="340" y="243" font-family="Arial, Helvetica, sans-serif">Type AB</text><text x="525" y="243" font-family="Arial, Helvetica, sans-serif">Type ABC</text><text x="965" y="243" font-family="Arial, Helvetica, sans-serif">Send search request</text>
<text x="155" y="265" class="small muted" font-family="Arial, Helvetica, sans-serif">0ms</text><text x="340" y="265" class="small muted" font-family="Arial, Helvetica, sans-serif">100ms</text><text x="525" y="265" class="small muted" font-family="Arial, Helvetica, sans-serif">200ms</text><text x="965" y="265" class="small muted" font-family="Arial, Helvetica, sans-serif">500ms</text></g>
<g fill="#2563eb"><circle cx="155" cy="283" r="8"/><circle cx="340" cy="283" r="8"/><circle cx="525" cy="283" r="8"/></g>
<circle cx="965" cy="283" r="16" fill="#16a085"/><path d="M957 282l6 6 11-13" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M155 304H340 M340 304H525" stroke="#e29b45" stroke-width="3" stroke-dasharray="7 6"/>
<g text-anchor="middle" class="tiny muted"><text x="248" y="329" font-family="Arial, Helvetica, sans-serif">Timer canceled / reset</text><text x="433" y="329" font-family="Arial, Helvetica, sans-serif">Timer canceled / reset</text></g>
<path d="M525 304H965" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 6"/><text x="744" y="329" text-anchor="middle" class="small blue bold" font-family="Arial, Helvetica, sans-serif">300ms without input</text>
<rect x="75" y="355" width="1050" height="47" rx="9" fill="#e7f0ff"/><text x="96" y="386" class="result" font-family="Arial, Helvetica, sans-serif">Result: 3 input events, 1 search request</text>
<!-- Throttle -->
<rect x="45" y="451" width="1110" height="295" rx="14" fill="#f8fbff" stroke="#b7d5fd" stroke-width="2"/>
<text x="75" y="493" class="h2" font-family="Arial, Helvetica, sans-serif">2. Throttle — Keep responding at a limited rate</text><text x="75" y="524" class="small muted" font-family="Arial, Helvetica, sans-serif">Drag / scroll: leading-edge throttle; calls within the interval are skipped</text>
<line x1="125" y1="596" x2="1085" y2="596" class="line" marker-end="url(#arr)"/>
<g text-anchor="middle" class="tiny muted"><text x="135" y="574" font-family="Arial, Helvetica, sans-serif">0ms</text><text x="227" y="574" font-family="Arial, Helvetica, sans-serif">200ms</text><text x="319" y="574" font-family="Arial, Helvetica, sans-serif">400ms</text><text x="411" y="574" font-family="Arial, Helvetica, sans-serif">600ms</text><text x="503" y="574" font-family="Arial, Helvetica, sans-serif">800ms</text><text x="595" y="574" font-family="Arial, Helvetica, sans-serif">1000ms</text><text x="687" y="574" font-family="Arial, Helvetica, sans-serif">1200ms</text><text x="779" y="574" font-family="Arial, Helvetica, sans-serif">1400ms</text><text x="871" y="574" font-family="Arial, Helvetica, sans-serif">1600ms</text><text x="963" y="574" font-family="Arial, Helvetica, sans-serif">1800ms</text><text x="1055" y="574" font-family="Arial, Helvetica, sans-serif">2000ms</text></g>
<circle cx="135" cy="596" r="9" fill="#2563eb"/><path d="M135 605V640" class="guide"/><circle cx="135" cy="653" r="13" fill="#16a085"/><path d="M129 653l4 4 8-10" fill="none" stroke="white" stroke-width="2.5"/><text x="135" y="687" text-anchor="middle" class="tiny bold" font-family="Arial, Helvetica, sans-serif">Run</text><circle cx="227" cy="596" r="6" fill="#b7c2d0"/><path d="M227 605V640" class="guide"/><text x="227" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="227" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="319" cy="596" r="6" fill="#b7c2d0"/><path d="M319 605V640" class="guide"/><text x="319" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="319" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="411" cy="596" r="6" fill="#b7c2d0"/><path d="M411 605V640" class="guide"/><text x="411" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="411" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="503" cy="596" r="6" fill="#b7c2d0"/><path d="M503 605V640" class="guide"/><text x="503" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="503" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="595" cy="596" r="9" fill="#2563eb"/><path d="M595 605V640" class="guide"/><circle cx="595" cy="653" r="13" fill="#16a085"/><path d="M589 653l4 4 8-10" fill="none" stroke="white" stroke-width="2.5"/><text x="595" y="687" text-anchor="middle" class="tiny bold" font-family="Arial, Helvetica, sans-serif">Run</text><circle cx="687" cy="596" r="6" fill="#b7c2d0"/><path d="M687 605V640" class="guide"/><text x="687" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="687" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="779" cy="596" r="6" fill="#b7c2d0"/><path d="M779 605V640" class="guide"/><text x="779" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="779" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="871" cy="596" r="6" fill="#b7c2d0"/><path d="M871 605V640" class="guide"/><text x="871" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="871" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="963" cy="596" r="6" fill="#b7c2d0"/><path d="M963 605V640" class="guide"/><text x="963" y="659" text-anchor="middle" class="body muted" font-family="Arial, Helvetica, sans-serif">×</text><text x="963" y="687" text-anchor="middle" class="tiny muted" font-family="Arial, Helvetica, sans-serif">Skip</text><circle cx="1055" cy="596" r="9" fill="#2563eb"/><path d="M1055 605V640" class="guide"/><circle cx="1055" cy="653" r="13" fill="#16a085"/><path d="M1049 653l4 4 8-10" fill="none" stroke="white" stroke-width="2.5"/><text x="1055" y="687" text-anchor="middle" class="tiny bold" font-family="Arial, Helvetica, sans-serif">Run</text><rect x="75" y="702" width="1050" height="29" rx="8" fill="#e7f0ff"/><text x="94" y="722" class="small bold" font-family="Arial, Helvetica, sans-serif">Result: events keep firing, with at least 1 second between executions (3 shown)</text>
<!-- use-case footer -->
<rect x="45" y="766" width="1110" height="105" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<line x1="600" y1="779" x2="600" y2="860" stroke="#cbd5e1"/>
<text x="76" y="795" class="body bold blue" font-family="Arial, Helvetica, sans-serif">When to use Debounce</text><text x="76" y="824" class="small" font-family="Arial, Helvetica, sans-serif">Search after typing stops; recalculate after resize ends</text><text x="76" y="849" class="small muted" font-family="Arial, Helvetica, sans-serif">Only the final result is needed</text>
<text x="632" y="795" class="body bold blue" font-family="Arial, Helvetica, sans-serif">When to use Throttle</text><text x="632" y="824" class="small" font-family="Arial, Helvetica, sans-serif">Ongoing feedback during drag or scroll</text><text x="632" y="849" class="small muted" font-family="Arial, Helvetica, sans-serif">Respond during interaction without processing every event</text>
</svg>