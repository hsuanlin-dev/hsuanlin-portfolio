<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #1a1a1a; letter-spacing: 0.5px; }
      .box-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 16px; font-weight: bold; }
      .box-desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; fill: #555555; line-height: 1.5; }
      .label-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #333333; }
      .code-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; font-weight: bold; }
      .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .flow-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; font-weight: bold; }
      
      /* Drop Shadows */
      .shadow { filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.08)); }
      .shadow-sm { filter: drop-shadow(0px 2px 5px rgba(0, 0, 0, 0.05)); }
    </style>
    
    <marker id="arrow-macro" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3182ce"/>
    </marker>
    <marker id="arrow-micro" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e53e3e"/>
    </marker>
  </defs>

  <rect width="1060" height="700" rx="16" fill="#f7fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="50" y="45" class="title">JavaScript Runtime ── Under-the-Hood Flow of Rate Limiting Strategies</text>

  <g class="shadow">
    <rect x="70" y="90" width="400" height="220" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="2"/>
    <text x="90" y="125" class="box-title" fill="#9b2c2c">Call Stack</text>
    <text x="90" y="148" class="box-desc">JS Main Thread executes code synchronously line by line.</text>
  </g>
  
  <g class="shadow-sm">
    <rect x="90" y="180" width="95" height="45" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="137" y="207" text-anchor="middle" class="label-text">Debounce</text>
  </g>
  <g class="shadow-sm">
    <rect x="200" y="180" width="95" height="45" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="247" y="207" text-anchor="middle" class="label-text">Throttle</text>
  </g>
  <g class="shadow-sm">
    <rect x="315" y="180" width="135" height="110" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="382" y="210" text-anchor="middle" class="label-text" fill="#e53e3e">Concurrency</text>
    <text x="382" y="235" text-anchor="middle" class="code-text" fill="#9b2c2c">runWithLimit</text>
    <text x="382" y="265" text-anchor="middle" class="box-desc" fill="#e53e3e" style="font-size:11px; font-weight: bold;">(Defines Rules)</text>
  </g>
  
  <rect x="90" y="250" width="205" height="40" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
  <text x="105" y="274" class="code-text" fill="#4a5568">Synchronous Exec</text>


  <g class="shadow">
    <rect x="560" y="90" width="430" height="220" rx="12" fill="#f0fff4" stroke="#9ae6b4" stroke-width="2"/>
    <text x="580" y="125" class="box-title" fill="#22543d">Web APIs (Browser Environment)</text>
    <text x="580" y="148" class="box-desc">Handles background timing and network operations asynchronously.</text>
  </g>

  <g class="shadow-sm">
    <rect x="580" y="180" width="240" height="52" rx="6" fill="#ffffff" stroke="#3182ce" stroke-width="1.5"/>
    <text x="595" y="201" text-anchor="start">
      <tspan class="code-text" fill="#2b6cb0">setTimeout()</tspan>
      <tspan x="595" dy="17" class="box-desc" style="font-size:11px; font-weight: 500; fill: #4a5568;">── Debounce/Throttle Timer</tspan>
    </text>
  </g>
  
  <g class="shadow-sm">
    <rect x="580" y="248" width="240" height="52" rx="6" fill="#ffffff" stroke="#e53e3e" stroke-width="2"/>
    <text x="595" y="269" text-anchor="start">
      <tspan class="code-text" fill="#b7791f">fetch()</tspan>
      <tspan x="595" dy="17" class="box-desc" fill="#e53e3e" style="font-size:11px; font-weight:bold;">── Network Connection (Concurrent)</tspan>
    </text>
  </g>
  
  <rect x="835" y="180" width="135" height="120" rx="6" fill="#edf2f7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="902" y="230" text-anchor="middle" class="box-desc" fill="#718096">DOM / XHR</text>
  <text x="902" y="255" text-anchor="middle" class="box-desc" fill="#718096">Storage Ops</text>


  <g class="shadow">
    <rect x="70" y="380" width="435" height="110" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="2"/>
    <rect x="85" y="392" width="65" height="22" rx="4" fill="#e53e3e"/>
    <text x="117" y="408" text-anchor="middle" class="badge-text">Micro</text>
    <text x="165" y="409" class="box-title" fill="#9b2c2c">Microtask Queue</text>
    <text x="85" y="435" class="box-desc">Holds Promise callbacks. Priority: Flushed completely before any macrotask.</text>
  </g>
  
  <g class="shadow-sm">
    <rect x="85" y="448" width="185" height="34" rx="4" fill="#ffffff" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="95" y="462" text-anchor="start">
      <tspan class="code-text" fill="#b7791f">worker()</tspan>
      <tspan x="95" dy="13" class="box-desc" style="font-size:10px; fill: #718096; font-weight:bold;">next task callback</tspan>
    </text>
  </g>
  
  <g class="shadow-sm">
    <rect x="285" y="448" width="110" height="34" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
    <text x="340" y="470" text-anchor="middle" class="code-text" fill="#718096">Promise.then</text>
  </g>

  <g class="shadow">
    <rect x="555" y="380" width="435" height="110" rx="12" fill="#ebf8ff" stroke="#bee3f8" stroke-width="2"/>
    <rect x="570" y="392" width="65" height="22" rx="4" fill="#3182ce"/>
    <text x="602" y="408" text-anchor="middle" class="badge-text">Macro</text>
    <text x="645" y="409" class="box-title" fill="#2b6cb0">Macrotask Queue (Task Queue)</text>
    <text x="570" y="435" class="box-desc">Holds timer and UI events. Protocol: Processes exactly one task per turn.</text>
  </g>
  <g class="shadow-sm">
    <rect x="570" y="448" width="200" height="34" rx="4" fill="#ffffff" stroke="#3182ce" stroke-width="1.5"/>
    <text x="670" y="470" text-anchor="middle" class="code-text" fill="#1a365d">handleSearch / handleDrag</text>
  </g>
  <g class="shadow-sm">
    <rect x="785" y="448" width="110" height="34" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
    <text x="840" y="470" text-anchor="middle" class="code-text" fill="#718096">timer callback</text>
  </g>


  <g class="shadow">
    <rect x="70" y="560" width="920" height="80" rx="12" fill="#f3e8ff" stroke="#d6bcfa" stroke-width="2"/>
    <text x="100" y="605" class="box-title" fill="#4c1d95" style="font-size: 18px;">Event Loop Engine</text>
    <text x="310" y="603" class="box-desc" fill="#5b21b6" style="font-weight: bold;">Orchestrates execution: Once Call Stack is empty, flushes Microtasks first, then processes one Macrotask.</text>
  </g>


  <path d="M 470,195 L 580,195" fill="none" stroke="#3182ce" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-macro)"/>
  <path d="M 450,245 L 520,245 L 520,275 L 580,275" fill="none" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow-micro)"/>
  <text x="525" y="180" text-anchor="middle" class="flow-text" fill="#2b6cb0">Register Timer</text>
  <text x="525" y="235" text-anchor="middle" class="flow-text" fill="#e53e3e">await / fire fetch</text>

  <path d="M 700,300 L 700,335 L 285,335 L 285,370" fill="none" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow-micro)"/>
  <text x="495" y="325" text-anchor="middle" class="flow-text" fill="#e53e3e">Network Resolve (Response Landed)</text>
  
  <path d="M 800,205 L 920,205 L 920,335 L 772,335 L 772,370" fill="none" stroke="#3182ce" stroke-width="2" marker-end="url(#arrow-macro)"/>
  <text x="850" y="325" text-anchor="middle" class="flow-text" fill="#2b6cb0">Timer Elapsed</text>

  <path d="M 285,490 L 285,552" fill="none" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow-micro)"/>
  <path d="M 772,490 L 772,552" fill="none" stroke="#3182ce" stroke-width="2" marker-end="url(#arrow-macro)"/>
  
  <rect x="145" y="510" width="125" height="24" rx="4" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="207" y="526" text-anchor="middle" class="flow-text" fill="#e53e3e">⭐ High-Priority Flush</text>
  
  <rect x="777" y="510" width="115" height="24" rx="4" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1"/>
  <text x="834" y="526" text-anchor="middle" class="flow-text" fill="#3182ce">One Task Per Turn</text>

  <path d="M 70,600 L 20,600 L 20,120 L 62,120" fill="none" stroke="#e53e3e" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-micro)"/>
  
  <g class="shadow">
    <rect x="30" y="315" width="195" height="48" rx="6" fill="#e53e3e"/>
    <text x="127" y="334" text-anchor="middle" class="badge-text" style="font-size:12px; fill:#ffffff; font-weight:bold;">Concurrency Engine Loop</text>
    <text x="127" y="352" text-anchor="middle" class="badge-text" style="font-size:10px; fill:#fffff0;">(Event Loop drives automatic refills)</text>
  </g>

</svg>
